name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "building"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "testing"
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy
        run: echo "deploying"
