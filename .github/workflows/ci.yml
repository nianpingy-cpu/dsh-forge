name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Print pinned DeepSeek Harness SHA
        run: node -e "const m=require('./compatibility/deepseek-harness.json');console.log('Pinned DeepSeek Harness commit:',m.commit,'('+m.branch+')')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Ruff (integration fixtures)
        run: python -m pip install --quiet --break-system-packages ruff

      - name: Install uv (integration fixtures)
        uses: astral-sh/setup-uv@v5

      - name: Install semgrep (integration fixtures)
        run: python -m pip install --quiet --break-system-packages semgrep

      - name: Install trivy (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Install act (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz -o act.tar.gz
          tar -xzf act.tar.gz -C /usr/local/bin act
          act --version

      - name: Install k6 (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz -o k6.tar.gz
          # The k6 release archive is directory-wrapped (k6-v0.53.0-linux-amd64/k6);
          # strip the wrapper so the binary lands at /usr/local/bin/k6.
          tar -xzf k6.tar.gz -C /usr/local/bin --strip-components=1
          k6 version

      # ffmpeg for the plugin-ffmpeg live integration tests. Linux uses apt
      # (deterministic; the setup-ffmpeg action's release-version lookup is
      # flaky on Linux runners); Windows uses the cross-platform action.
      - name: Install ffmpeg (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install ffmpeg (integration fixtures, Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Compatibility matrix — Pinned lane (required, release blocker): the
  # pinned upstream manifest must be valid (non-empty repository + commit)
  # or the release is blocked. The Latest lane (drift reports) is scheduled
  # separately in compat-latest.yml and is non-blocking.
  compat-pinned:
    name: compat matrix (Pinned lane, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (pinned, type-stripping capable)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate pinned upstream manifest (release blocker)
        run: node scripts/compat-matrix.ts compatibility/deepseek-harness.json compatibility/deepseek-harness.json

  # Supply-chain / release hardening (ISSUE-029): secret scan of built
  # artifacts, package contents allowlist, no redistributed binaries,
  # lockfile discipline, license allowlist. Runs after the build so dist/
  # artifacts are present.
  supply-chain:
    name: supply-chain (release hardening)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (pinned, type-stripping capable)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (produces dist artifacts to scan)
        run: pnpm build

      - name: Run supply-chain check (secrets, contents, binaries, lockfile, licenses)
        run: node scripts/supply-chain-check.ts

      - name: Stage dist trees for checksum verification
        run: |
          mkdir -p compatibility/reports/dist
          for d in packages/*/dist; do
            pkg=$(basename "$(dirname "$d")")
            mkdir -p "compatibility/reports/dist/$pkg"
            cp -r "$d/." "compatibility/reports/dist/$pkg/"
          done

      - name: Upload supply-chain artifacts (SBOM + checksums + dist trees)
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: compatibility/reports/
          if-no-files-found: error

