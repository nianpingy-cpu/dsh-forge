name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Print pinned DeepSeek Harness SHA
        run: node -e "const m=require('./compatibility/deepseek-harness.json');console.log('Pinned DeepSeek Harness commit:',m.commit,'('+m.branch+')')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Ruff (integration fixtures)
        run: python -m pip install --quiet --break-system-packages ruff

      - name: Install uv (integration fixtures)
        uses: astral-sh/setup-uv@v5

      - name: Install semgrep (integration fixtures)
        run: python -m pip install --quiet --break-system-packages semgrep

      - name: Install trivy (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Install act (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz -o act.tar.gz
          tar -xzf act.tar.gz -C /usr/local/bin act
          act --version

      - name: Install k6 (integration fixtures, Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz -o k6.tar.gz
          # The k6 release archive is directory-wrapped (k6-v0.53.0-linux-amd64/k6);
          # strip the wrapper so the binary lands at /usr/local/bin/k6.
          tar -xzf k6.tar.gz -C /usr/local/bin --strip-components=1
          k6 version

      - name: Install ffmpeg (integration fixtures, all OS)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
